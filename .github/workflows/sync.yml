name: Sync Excel to Google Sheets

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *"   # cadangan: jalan sekali sehari, biar repo tidak dianggap inactive 60 hari

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync script
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python sync_excel.py
